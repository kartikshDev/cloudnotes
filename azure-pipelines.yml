trigger: none

pr:
  branches:
    include:
      - main

variables:
  - group: cloudnotes-common
  - name: tfDir
    value: day5-terraform

pool:
  vmImage: ubuntu-latest

stages:
  - stage: Validate
    jobs:
      - job: TerraformCheck
        steps:
          - checkout: self
          - script: |
              wget -q https://releases.hashicorp.com/terraform/1.9.8/terraform_1.9.8_linux_amd64.zip
              unzip -q terraform_1.9.8_linux_amd64.zip
              sudo mv terraform /usr/local/bin/
            displayName: Install Terraform
          - script: terraform version
            displayName: Show Terraform version
          - script: terraform fmt -check
            workingDirectory: $(tfDir)
            displayName: Format check
          - script: terraform init -backend=false
            workingDirectory: $(tfDir)
            displayName: Init
          - script: terraform validate
            workingDirectory: $(tfDir)
            displayName: Validate

  - stage: Deploy
    dependsOn: Validate
    jobs:
      - deployment: DeployDev
        environment: dev
        strategy:
          runOnce:
            deploy:
              steps:
                - script: echo "Deploying to dev"
                  displayName: Fake deploy
                - script: echo "Location is $(location)"
                  displayName: Show location