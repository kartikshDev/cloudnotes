trigger: none

pr:
  branches:
    include:
      - main

variables:
  - group: cloudnotes-common
  - name: tfDir
    value: day5-terraform

pool:
  vmImage: ubuntu-latest

stages:
  - stage: Validate
    jobs:
      - job: TerraformCheck
        steps:
          - checkout: self
          - script: |
              wget -q https://releases.hashicorp.com/terraform/1.9.8/terraform_1.9.8_linux_amd64.zip
              unzip -q terraform_1.9.8_linux_amd64.zip
              sudo mv terraform /usr/local/bin/
            displayName: Install Terraform
          - script: terraform version
            displayName: Show Terraform version
          - script: terraform fmt -check
            workingDirectory: $(tfDir)
            displayName: Format check
          - script: terraform init -backend=false
            workingDirectory: $(tfDir)
            displayName: Init
          - script: terraform validate
            workingDirectory: $(tfDir)
            displayName: Validate
          - task: AzureCLI@2
            displayName: Terraform plan
            inputs:
              azureSubscription: CloudNotes
              scriptType: bash
              scriptLocation: inlineScript
              addSpnToEnvironment: true
              workingDirectory: $(tfDir)
              inlineScript: |
                export ARM_CLIENT_ID=$servicePrincipalId
                export ARM_TENANT_ID=$tenantId
                export ARM_SUBSCRIPTION_ID=$(az account show --query id -o tsv)
                export TF_VAR_my_ip=$(curl -s https://ifconfig.me)
                export TF_VAR_subscription_id=$ARM_SUBSCRIPTION_ID
                export ARM_OIDC_TOKEN=$idToken
                export ARM_USE_OIDC=true
                terraform init -input=false
                terraform plan -input=false
                terraform apply -auto-approve -input=false

  - stage: Deploy
    dependsOn: Validate
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - deployment: DeployDev
        environment: dev
        strategy:
          runOnce:
            deploy:
              steps:
                - script: echo "Deploying to dev"
                  displayName: Fake deploy
                - script: echo "Location is $(location)"
                  displayName: Show location
                - script: echo "Secret is $(mySecret)"
                  displayName: Show secret
                